<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Barcode Label — {{ sample.barcode_string }}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600&display=swap');
    body { font-family:'Inter',sans-serif; background:#fff; display:flex; justify-content:center; padding:20px; }
    .label {
      width: 340px;
      border: 1.5px solid #0F172A;
      border-radius: 8px;
      padding: 16px;
      page-break-inside: avoid;
    }
    .lab-name { font-size: 13px; font-weight:600; color:#0F172A; border-bottom:1px solid #E2E8F0; padding-bottom:8px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .barcode { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; letter-spacing:.12em; color:#0F172A; text-align:center; background:#F8FAFC; padding:10px; border-radius:6px; border:1px dashed #CBD5E1; margin:10px 0; }
    .row { display:flex; justify-content:space-between; margin-bottom:5px; font-size:11px; }
    .row .label-k { color:#64748B; }
    .row .label-v { font-weight:600; color:#0F172A; text-align:right; max-width:200px; }
    .badge { display:inline-block; background:#DCFCE7; color:#166534; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; }
    .print-btn { margin-top:14px; width:100%; padding:8px; background:#166534; color:#fff; border:none; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; }
    .print-btn:hover { background:#14532D; }
    @media print { .print-btn { display:none; } }
  </style>
</head>
<body>
  <div>
    <div class="label">
      <div class="lab-name">
        MedLab Diagnostics — Sample Label
      </div>
      <div style="text-align:center;margin:10px 0;">
        <img src="{{ url_for('receptionist.download_barcode_image', barcode_string=sample.barcode_string) }}"
             alt="Barcode {{ sample.barcode_string }}"
             style="max-width:100%;height:auto;display:block;margin:0 auto;border-radius:4px;">
      </div>
      <div class="row"><span class="label-k">Patient</span><span class="label-v">{{ sample.full_name }}</span></div>
      <div class="row"><span class="label-k">Phone</span><span class="label-v">{{ sample.phone }}</span></div>
      <div class="row"><span class="label-k">Test</span><span class="label-v">{{ sample.test_name }}</span></div>
      <div class="row"><span class="label-k">Sample Type</span><span class="label-v"><span class="badge">{{ sample.sample_type }}</span></span></div>
      <div class="row"><span class="label-k">Booking Ref</span><span class="label-v" style="font-family:'JetBrains Mono',monospace;">{{ sample.booking_ref }}</span></div>
      <div class="row"><span class="label-k">Collected At</span><span class="label-v">{{ sample.collected_at }}</span></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;" class="print-btn-group">
      <button class="print-btn" onclick="window.print()" style="margin:0;flex:1;">Print Label</button>
      <a href="{{ url_for('receptionist.download_barcode_image', barcode_string=sample.barcode_string) }}"
         class="print-btn"
         style="margin:0;flex:1;background:#0F172A;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;"
         download="Barcode-{{ sample.barcode_string }}.png">Download Image</a>
    </div>
  </div>
</body>
</html>
